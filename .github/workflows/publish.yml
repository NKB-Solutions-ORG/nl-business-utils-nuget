name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - name: Verify tag matches project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(dotnet msbuild src/NLBusinessUtils/NLBusinessUtils.csproj -getProperty:Version)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Release tag ($GITHUB_REF_NAME) does not match project version ($PKG_VERSION)"
            exit 1
          fi

      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack src/NLBusinessUtils/NLBusinessUtils.csproj --no-build -c Release -o ./artifacts

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: nkb-niels

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
